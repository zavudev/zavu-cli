# Publishes the `zavudev` CLI to npm when main has a version npm does not have yet.
#
# This repository mirrors packages/zavu-cli of the zavudev/zavu monorepo (see
# RELEASING.md). The monorepo runs the test suite before anything lands here;
# several tests read files that only exist there (the OpenAPI spec, the
# backend's copy of the eve compat module), so this workflow does not run them
# again. It builds, checks the built binary, and publishes.
#
# - Pushes to main (the monorepo sync pushes here): install from bun.lock,
#   build, check that `zavudev --version` prints package.json's version, then
#   `npm publish --provenance` unless npm already has that version, so syncs
#   that do not bump the version publish nothing. A version with a
#   pre-release part (0.16.0-beta.1) goes to the `next` dist-tag, any other to
#   `latest`. Then it creates the `cli-v<version>` tag and a GitHub Release.
# - workflow_dispatch: the same job by hand, a dry run by default.
#
# Auth is npm trusted publishing (OIDC), with no token: npm must list this
# repository and this workflow file as the package's trusted publisher.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and `npm publish --dry-run` only. Nothing is published, tagged or released.
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, never cancelled halfway through a publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    # Never from a fork or a copy of this repository.
    if: github.repository == 'zavudev/zavu-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the cli-v<version> tag and the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - name: Refuse to publish from a ref other than main
        if: github.ref != 'refs/heads/main' && env.DRY_RUN != 'true'
        run: |
          echo "::error::Publishing runs from main only (this run is on ${GITHUB_REF}). Re-run on main, or tick dry-run."
          exit 1

      - uses: actions/checkout@v5
        with:
          # Tags, to start the release notes at the previous cli-v<version> tag.
          fetch-depth: 0

      # `prepack` runs `bun run build`, so bun is needed by `npm publish` too.
      # `latest`, like the monorepo's CLI job, which installs this same
      # bun.lock with --frozen-lockfile before anything is merged. An older
      # pin cannot read the lockfile format newer bun writes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Trusted publishing needs Node 22.14 or later and npm 11.5.1 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update npm
        run: npm install --global npm@^11.5.1 && npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Plan
        id: plan
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then dist_tag=next; prerelease=true; else dist_tag=latest; prerelease=false; fi
          if npm view "${name}@${version}" version > /dev/null 2>&1; then published=true; else published=false; fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=cli-v$version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
            echo "published=$published"
          } | tee -a "$GITHUB_OUTPUT"

      # The build inlines package.json, so a binary that reports another
      # version means the tarball and the manifest disagree.
      - name: Build and check the binary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          bun run build
          reported="$(node dist/zavu.js --version)"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::dist/zavu.js reports $reported, package.json says $VERSION."
            exit 1
          fi
          node dist/zavu.js --help > /dev/null

      - name: Publish ${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.dist_tag }})
        if: steps.plan.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
        # npm exchanges this job's OIDC token (id-token: write) for a
        # short-lived publish token and signs a provenance statement that ties
        # the tarball to this commit and workflow run.
        run: |
          args=(--access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--provenance)
          fi
          npm publish "${args[@]}"

      - name: Already on npm
        if: steps.plan.outputs.published == 'true'
        run: echo "::notice::${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }} is already on npm; nothing to publish."

      - name: Tag and GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; nothing to do."
            exit 0
          fi
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          previous="$(git tag --list 'cli-v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
